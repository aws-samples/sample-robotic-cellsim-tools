[package]
name = "robo-fitting-room"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Programmatic scene composition and validation engine: assemble, validate, and drive simulation scenes from URDF inputs"

[lib]
name = "robo_fitting_room"
path = "src/lib.rs"

[[bin]]
name = "robo-fitting-room"
path = "src/main.rs"

[features]
# Default-on: a plain `cargo build` / `cargo run` produces the
# full-featured binary (CLI + REST server + embedded 2D editor SPA).
# To get the slim CLI-only build (no axum/tokio/utoipa/SPA bundle in
# the dep graph) pass `--no-default-features`.
default = ["server"]
# FR-180+: in-binary HTTP server hosting the embedded 2D scene-layout
# editor + a small REST API over the existing compose pipeline.
server = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:include_dir",
    "dep:serde_json",
    "dep:mime_guess",
    "dep:utoipa",
    "dep:utoipa-swagger-ui",
]
# Opt-in test feature: enables `tests/real_assets.rs` which compose
# scenes against the in-repo `../assets/` directory. The asset tree is
# vendor-specific and will NOT ship with the open-source release; drop
# this feature from CI when those URDFs are pruned. Tests inside still
# skip gracefully if individual files are missing.
real-assets = []

[dependencies]
urdf-robo-dresser = { path = "../urdf-robo-dresser" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
pathdiff = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
env_logger = "0.11"

# server feature deps
axum = { version = "0.7", optional = true, features = ["multipart"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "fs", "net", "signal"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", optional = true, features = ["fs", "cors", "trace", "set-header"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
include_dir = { version = "0.7", optional = true }
serde_json = { version = "1", optional = true }
mime_guess = { version = "2", optional = true }
utoipa = { version = "4", optional = true, features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7", optional = true, features = ["axum"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
pretty_assertions = "1"
